<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradients -->
    <radialGradient id="bgGlow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#064e3b" stop-opacity="0.8"/>
      <stop offset="60%" stop-color="#09090b" stop-opacity="1"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="1"/>
    </radialGradient>

    <!-- Emerald Primary Gradient -->
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6ee7b7"/>
      <stop offset="50%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>

    <!-- Neon Glow Filter -->
    <filter id="neonGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="12" result="blur1" />
      <feGaussianBlur stdDeviation="24" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Accent Gradient -->
    <linearGradient id="cyanAccent" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="50%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
  </defs>

  <!-- App Icon Base Background -->
  <rect width="512" height="512" rx="115" fill="url(#bgGlow)"/>
  
  <!-- Outer Subtle Border -->
  <rect width="504" height="504" x="4" y="4" rx="111" fill="none" stroke="#10b981" stroke-width="4" stroke-opacity="0.3"/>

  <!-- Concentric Sound Frequency Rings -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="#10b981" stroke-width="3" stroke-opacity="0.15" stroke-dasharray="8 12"/>
  <circle cx="256" cy="256" r="150" fill="none" stroke="#34d399" stroke-width="4" stroke-opacity="0.25"/>
  <circle cx="256" cy="256" r="115" fill="none" stroke="#06b6d4" stroke-width="3" stroke-opacity="0.35" stroke-dasharray="16 10"/>

  <!-- Outer Sound Bars (Left & Right frequency spectrum) -->
  <g fill="url(#emeraldGrad)" opacity="0.85">
    <!-- Left Equalizer Columns -->
    <rect x="90" y="216" width="10" height="80" rx="5"/>
    <rect x="112" y="176" width="10" height="160" rx="5"/>
    <rect x="134" y="146" width="10" height="220" rx="5"/>
    
    <!-- Right Equalizer Columns -->
    <rect x="368" y="146" width="10" height="220" rx="5"/>
    <rect x="390" y="176" width="10" height="160" rx="5"/>
    <rect x="412" y="216" width="10" height="80" rx="5"/>
  </g>

  <!-- Central High-Impact Music Monogram: Stylized "P" with Play / Soundwave core -->
  <g filter="url(#neonGlow)">
    <!-- Stylized "P" stem / pulse -->
    <rect x="186" y="130" width="34" height="252" rx="17" fill="url(#emeraldGrad)" />

    <!-- "P" loop with modern acoustic play wedge curve -->
    <path d="M 203 130 
             L 285 130 
             A 66 66 0 0 1 285 262 
             L 203 262 
             Z" 
          fill="url(#emeraldGrad)" />

    <!-- Inner Core Cutout of "P" creating modern negative space -->
    <path d="M 220 162 
             L 280 162 
             A 34 34 0 0 1 280 230 
             L 220 230 
             Z" 
          fill="#09090b" />

    <!-- Radiant Play Glyph in center loop -->
    <polygon points="244,180 274,196 244,212" fill="#34d399"/>
  </g>

  <!-- Ambient Flare & Glow Dots -->
  <circle cx="285" cy="196" r="6" fill="#ffffff" filter="url(#neonGlow)"/>
  <circle cx="203" cy="382" r="5" fill="#34d399" filter="url(#neonGlow)"/>
  <circle cx="139" cy="256" r="4" fill="#6ee7b7"/>
  <circle cx="373" cy="256" r="4" fill="#6ee7b7"/>
</svg>
