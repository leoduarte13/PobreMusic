<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#09090b"/>
      <stop offset="50%" stop-color="#18181b"/>
      <stop offset="100%" stop-color="#042f2e"/>
    </linearGradient>
    <linearGradient id="emeraldNeon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="50%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="cyanGlow" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Card -->
  <rect width="512" height="512" rx="120" fill="url(#bgGrad)" stroke="#27272a" stroke-width="6"/>

  <!-- Outer Neon Wave Ring -->
  <circle cx="256" cy="256" r="200" fill="none" stroke="url(#cyanGlow)" stroke-width="4" stroke-opacity="0.4" stroke-dasharray="12 8"/>

  <!-- Vinyl Body -->
  <circle cx="256" cy="256" r="175" fill="#121215" stroke="#27272a" stroke-width="5"/>
  <circle cx="256" cy="256" r="148" fill="none" stroke="#27272a" stroke-width="2" stroke-opacity="0.6"/>
  <circle cx="256" cy="256" r="122" fill="none" stroke="#27272a" stroke-width="2" stroke-opacity="0.6"/>
  <circle cx="256" cy="256" r="96" fill="none" stroke="#27272a" stroke-width="2" stroke-opacity="0.6"/>

  <!-- Vinyl Glow Center -->
  <circle cx="256" cy="256" r="75" fill="url(#emeraldNeon)" filter="url(#glow)"/>
  <circle cx="256" cy="256" r="72" fill="url(#emeraldNeon)"/>

  <!-- Sound Waves inside Vinyl -->
  <path d="M220 256 c0-19.9 16.1-36 36-36 s36 16.1 36 36" fill="none" stroke="#09090b" stroke-width="6" stroke-linecap="round"/>
  <path d="M205 256 c0-28.2 22.8-51 51-51 s51 22.8 51 51" fill="none" stroke="#09090b" stroke-width="6" stroke-linecap="round"/>

  <!-- Music / Play Icon & P Initial -->
  <!-- Modern Geometric Play/Sound Triangle -->
  <polygon points="244,228 280,256 244,284" fill="#09090b" />
  <circle cx="256" cy="256" r="12" fill="#ffffff"/>

  <!-- Glowing Accent Dots around Vinyl -->
  <circle cx="256" cy="62" r="7" fill="#34d399" filter="url(#glow)"/>
  <circle cx="450" cy="256" r="7" fill="#10b981" filter="url(#glow)"/>
  <circle cx="256" cy="450" r="7" fill="#06b6d4" filter="url(#glow)"/>
  <circle cx="62" cy="256" r="7" fill="#10b981" filter="url(#glow)"/>
</svg>
