name: PobreMusic Android APK
on:
  workflow_dispatch:
  push:
    paths: ['pobremusic-mobile/**']
jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pobremusic-mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: pobremusic-mobile/package.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - run: npm install
      - run: npm run build
      - run: npx cap add android
      - run: npx cap sync android
      - run: chmod +x android/gradlew && android/gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: PobreMusic-debug-apk
          path: pobremusic-mobile/android/app/build/outputs/apk/debug/app-debug.apk
