name: Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build APK
        working-directory: android
        run: gradle assembleDebug --no-daemon
      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk android/app/build/outputs/apk/debug/PobreMusic-v1.2.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PobreMusic-v1.2
          path: android/app/build/outputs/apk/debug/PobreMusic-v1.2.apk
