name: PobreMusic Mobile
on:
  push:
    paths:
      - 'pobremusic-mobile/**'
      - '.github/workflows/mobile.yml'
  workflow_dispatch:
jobs:
  build-web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pobremusic-mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: pobremusic-mobile/package.json
      - run: npm install
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: PobreMusic-web-dist
          path: pobremusic-mobile/dist
  build-apk:
    needs: build-web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pobremusic-mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: android-actions/setup-android@v3
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: npm install
      - run: npm run build
      - run: npx cap add android
      - run: npx cap sync android
      - run: cd android && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: PobreMusic-debug-apk
          path: pobremusic-mobile/android/app/build/outputs/apk/debug/app-debug.apk
